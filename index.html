<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6e9">
  <title>Pixel Blaster｜晴光草原</title>
  <link rel="stylesheet" href="style.css?v=21">
  <script src="game.js?v=21" defer></script>
</head>
<body>
  <main class="arcade">
    <header class="masthead">
      <h1>PIXEL <span>BLASTER</span></h1>
      <div class="stage"><span id="level-number" lang="en">LEVEL 01</span><b id="level-name">晴光草原</b></div>
      <div class="skill-controls">
        <button type="button" id="domain-skill" data-action="domain" aria-keyshortcuts="K" aria-disabled="true"><span id="domain-name">無限星界</span><b id="domain-status">未解鎖</b></button>
        <button type="button" id="ultimate-skill" data-action="ultimate" aria-keyshortcuts="L" aria-label="必殺技"><span>必殺技</span><b id="ultimate-status">READY</b><progress id="ultimate-progress" max="300" value="300" aria-label="蓄力剩餘時間" hidden></progress></button>
      </div>
      <button id="settings-toggle" class="gear" type="button" aria-label="遊戲設定" aria-haspopup="dialog" aria-controls="settings-panel"><span aria-hidden="true">⚙︎</span></button>
    </header>
    <section class="machine" aria-label="Pixel Blaster 遊戲區">
      <div class="screen" id="screen">
        <canvas id="game" width="480" height="270" aria-label="Pixel Blaster 遊戲畫面" aria-describedby="controls goal">你的瀏覽器需要支援 HTML5 Canvas 才能遊玩。</canvas>
        <div class="hud">
          <span id="health" class="hearts" role="img" aria-label="3 / 3 點生命"><i></i><i></i><i></i></span>
          <span class="score-box"><i aria-hidden="true">✦</i><span class="sr-only">分數</span><b id="score">0000</b></span>
          <progress id="stage-progress" max="100" value="0" aria-label="到終點的進度" title="到終點的進度"></progress>
        </div>
        <p id="supply-message" hidden></p>
        <div id="boss-hud" hidden>
          <div class="boss-label"><span id="boss-name">熔核巨像</span><span id="boss-phase"></span></div>
          <strong id="boss-warning" role="status"></strong>
          <span id="boss-domain" hidden></span>
          <progress id="boss-health" aria-labelledby="boss-name" max="120" value="120"></progress>
        </div>
        <div id="result" class="result" hidden>
          <div class="card result-card">
            <h2 id="result-title" tabindex="-1"></h2><p id="result-detail"></p>
            <div class="result-actions">
              <button id="next-level" type="button" hidden>下一關</button>
              <button id="retry-level" type="button" hidden>重試本關</button>
              <button id="replay" type="button">再玩一次</button>
            </div>
          </div>
        </div>
      </div>
      <div id="controls" class="control-strip">
        <div class="touch-controls" role="group" aria-label="觸控操作">
          <div class="touch-move">
            <button type="button" data-action="left" aria-label="向左移動"><i aria-hidden="true"></i></button>
            <button type="button" data-action="jump" aria-label="向上跳躍"><i aria-hidden="true"></i></button>
            <button type="button" data-action="right" aria-label="向右移動"><i aria-hidden="true"></i></button>
          </div>
          <div class="touch-action">
            <button type="button" data-action="fire"><i aria-hidden="true"></i>射擊</button>
          </div>
        </div>
        <div class="keyboard-guide"><span><kbd>←</kbd> <kbd>→</kbd> 移動</span><span><kbd>SPACE</kbd> 跳躍</span><span><kbd>X</kbd> 射擊</span></div>
        <button id="weapon-toggle" class="loadout" type="button" aria-haspopup="dialog" aria-controls="weapon-panel" title="切換武器">
          <i class="gun" aria-hidden="true"></i><span id="equipped">彩虹彈</span><span class="switch-label">切換</span>
        </button>
      </div>
    </section>
    <p id="goal" class="sr-only">一路向右抵達旗幟。從磚頭下方跳起可解鎖武器。</p>
    <div id="announce" class="sr-only" role="status"></div>
  </main>
  <dialog id="settings-panel" aria-labelledby="settings-title">
    <div class="panel-heading"><h2 id="settings-title">遊戲設定</h2><button class="close" type="button" data-close aria-label="關閉設定">×</button></div>
    <p class="record">最高分 <b id="best-score">0</b></p>
    <p id="storage-notice" hidden role="status">瀏覽器目前無法儲存，進度僅保留到本頁關閉。</p>
    <div class="settings-list">
      <button id="music" type="button" aria-label="背景音樂" aria-pressed="true">♫ 音樂開</button>
      <button id="sound" type="button" aria-label="遊戲音效" aria-pressed="true">♪ 音效開</button>
      <button id="show-guide" type="button">新手引導</button>
      <button id="change-character" type="button" aria-haspopup="dialog">更換角色</button>
      <button id="restart" type="button">重新開始</button>
    </div>
    <!-- site-account -->
  </dialog>
  <dialog id="character-panel" aria-labelledby="character-title">
    <div class="panel-heading"><h2 id="character-title">選擇角色</h2><button id="cancel-character" class="close" type="button" aria-label="返回設定" hidden>×</button></div>
    <div class="character-cards">
      <button type="button" data-character="astral">
        <canvas width="30" height="30" aria-hidden="true"></canvas>
        <strong>星界術師</strong><span>無限星界</span><small>定住敵人</small>
        <small class="current-character" hidden>目前角色</small>
      </button>
      <button type="button" data-character="crimson">
        <canvas width="30" height="30" aria-hidden="true"></canvas>
        <strong>赤刃咒師</strong><span>赤刃神殿</span><small>持續斬擊</small>
        <small class="current-character" hidden>目前角色</small>
      </button>
    </div>
  </dialog>
  <dialog id="weapon-panel" aria-labelledby="weapon-title">
    <div class="panel-heading"><h2 id="weapon-title">切換武器</h2><button class="close" type="button" data-close aria-label="關閉武器清單">×</button></div>
    <div class="weapon-select" role="group" aria-label="選擇武器">
      <button type="button" data-weapon="0" aria-pressed="true"><kbd>1</kbd> 彩虹彈</button>
      <button type="button" data-weapon="1" aria-pressed="false" disabled><kbd>2</kbd> 星花散彈</button>
      <button type="button" data-weapon="2" aria-pressed="false" disabled><kbd>3</kbd> 晶光穿透槍</button>
      <button type="button" data-weapon="3" aria-pressed="false" disabled><kbd>4</kbd> 閃電槍</button>
      <button type="button" data-weapon="4" aria-pressed="false" disabled><kbd>5</kbd> 噴火槍</button>
      <button type="button" data-weapon="5" aria-pressed="false" disabled><kbd>6</kbd> 火焰雷射槍</button>
    </div>
  </dialog>
  <dialog id="guide-panel" aria-labelledby="guide-title">
    <div class="guide-step" id="guide-step"></div>
    <h2 id="guide-title"></h2><p id="guide-tip"></p>
    <div class="result-actions"><button id="skip-guide" type="button">跳過引導</button><button id="advance-guide" type="button" autofocus>下一步</button></div>
  </dialog>
  <dialog id="continue-panel" aria-labelledby="continue-title">
    <h2 id="continue-title">繼續冒險</h2><p id="save-detail"></p>
    <div class="result-actions"><button id="continue-game" type="button" autofocus>繼續遊戲</button><button id="new-game" type="button">從頭開始</button></div>
  </dialog>
  <dialog id="restart-panel" aria-labelledby="restart-title" aria-describedby="restart-detail">
    <h2 id="restart-title">從第一關重新開始？</h2>
    <p id="restart-detail">這次冒險的分數與進度會重設。</p>
    <div class="result-actions"><button id="cancel-restart" type="button" autofocus>取消</button><button id="confirm-restart" type="button">重新開始</button></div>
  </dialog>
</body>
</html>
