<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6e9">
  <title>Pixel Blaster｜晴光草原</title>
  <link rel="stylesheet" href="style.css?v=9">
  <script src="game.js?v=9" defer></script>
</head>
<body>
  <main class="arcade">
    <header class="masthead">
      <div>
        <h1>PIXEL <span>BLASTER</span><b aria-hidden="true">✦</b></h1>
        <p class="subtitle"><span id="level-number" lang="en">LEVEL 01</span> <b id="level-name">晴光草原</b></p>
      </div>
      <div class="game-settings">
        <button id="music" class="restart" type="button" aria-label="背景音樂" title="切換背景音樂" aria-pressed="true">♫ 音樂開</button>
        <button id="sound" class="restart" type="button" aria-label="遊戲音效" aria-pressed="true">♪ 音效開</button>
        <button id="restart" class="restart" type="button"><span aria-hidden="true">↻</span> 重新開始</button>
      </div>
    </header>

    <section class="machine" aria-label="Pixel Blaster 遊戲區">
      <div class="screen">
        <canvas id="game" width="480" height="270" aria-label="Pixel Blaster 遊戲畫面" aria-describedby="controls goal">
          你的瀏覽器需要支援 HTML5 Canvas 才能遊玩。
        </canvas>
        <div class="hud">
          <div class="hud-box">
            <span class="hud-label">生命</span>
            <span id="health" class="hearts" role="img" aria-label="3 / 3 點生命">
              <i class="heart"></i><i class="heart"></i><i class="heart"></i>
            </span>
          </div>
          <div class="hud-box score-box">
            <span class="hud-label">分數</span>
            <span id="score">0000</span>
          </div>
        </div>
        <p id="supply-message" class="supply-message" hidden></p>
        <div id="boss-hud" class="boss-hud" hidden>
          <div class="boss-label">
            <span id="boss-name">熔核巨像</span>
            <span id="boss-warning"></span>
          </div>
          <progress id="boss-health" aria-labelledby="boss-name" max="120" value="120"></progress>
        </div>
        <div id="result" class="result" hidden>
          <div class="result-card">
            <span class="result-star" aria-hidden="true">✦</span>
            <h2 id="result-title" tabindex="-1"></h2>
            <p id="result-detail"></p>
            <div class="result-actions">
              <button id="next-level" class="restart" type="button" hidden>下一關 <span aria-hidden="true">→</span></button>
              <button id="retry-level" class="restart" type="button" hidden>重試本關</button>
              <button id="replay" class="restart" type="button">再玩一次 <span aria-hidden="true">↻</span></button>
            </div>
          </div>
        </div>
      </div>
      <div id="controls" class="control-strip">
        <div class="keyboard-guide">
          <span><kbd>←</kbd> <kbd>→</kbd> 移動</span>
          <span><kbd>SPACE</kbd> 跳躍</span>
          <span><kbd>X</kbd> 發射</span>
        </div>
        <div class="touch-controls" role="group" aria-label="觸控操作">
          <div class="touch-move">
            <button type="button" data-action="left" aria-label="向左移動">◀</button>
            <button type="button" data-action="right" aria-label="向右移動">▶</button>
          </div>
          <div class="touch-action">
            <button type="button" data-action="jump"><span aria-hidden="true">▲</span> 跳躍</button>
            <button type="button" data-action="fire"><span aria-hidden="true">✦</span> 發射</button>
          </div>
        </div>
        <div class="weapon-select" role="group" aria-label="選擇武器">
          <button type="button" data-weapon="0" aria-label="彩虹彈 (1)" aria-pressed="true" title="連射彩虹彈"><kbd>1</kbd> 彩虹彈</button>
          <button type="button" data-weapon="1" aria-label="星花散彈 (2)" aria-pressed="false" title="頂開補給磚解鎖星花散彈" disabled><kbd>2</kbd> 散彈</button>
          <button type="button" data-weapon="2" aria-label="晶光穿透槍 (3)" aria-pressed="false" title="頂開補給磚解鎖晶光穿透槍" disabled><kbd>3</kbd> 穿透</button>
          <button type="button" data-weapon="3" aria-label="神器閃電槍 (4)" aria-pressed="false" title="神器閃電槍：按住發射，最多連鎖五個目標" disabled><kbd>4</kbd> 閃電</button>
          <button type="button" data-weapon="4" aria-label="噴火槍 (5)" aria-pressed="false" title="頂開補給磚解鎖噴火槍" disabled><kbd>5</kbd> 噴火</button>
          <button type="button" data-weapon="5" aria-label="火焰雷射槍 (6)" aria-pressed="false" title="頂開神器磚解鎖火焰雷射槍" disabled><kbd>6</kbd> 雷射</button>
        </div>
      </div>
    </section>
    <!-- site-account -->
    <p id="goal" class="sr-only">一路向右抵達旗幟。從補給磚下方跳起可解鎖武器。</p>
    <div id="announce" class="sr-only" role="status"></div>
  </main>
</body>
</html>
